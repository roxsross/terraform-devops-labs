name: CI DEVOPS EDIT

on:
    push: 
        branches: [ga-develop]
    pull_request:
    workflow_dispatch:

jobs:
    test:
        name: test
        runs-on: ubuntu-26.04
        defaults:
            run:
                working-directory: app
        steps:
            - name: Descarga del codigo
              uses: actions/checkout@v7
            - name: listar archivos del repositorio
              run: ls -la
            - name: Instalar Node.js
              uses: actions/setup-node@v7
              with:
                node-version: '24'
            - name: descarga de librerias de aplicacion
              run: npm install
            - name: Ejecutar los test
              run: npm test
    build:
        name: build
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            packages: write 
        needs: test
        defaults:
            run:
                working-directory: app       
        steps:
            - name: Descarga del codigo
              uses: actions/checkout@v7
            - name: Nombre de la imagen
              id: imagen
              run: |
                IMG=ghcr.io/${GITHUB_REPOSITORY,,}
                echo "nombre=$IMG-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            - name: preparar instalacion docker
              uses: docker/setup-qemu-action@v4
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}            
            - name: Build and push
              uses: docker/build-push-action@v7
              with: 
                platforms: linux/amd64,linux/arm64
                push: true
                tags: ${{ steps.imagen.output.nombre }}
            - name: Resumen
              run: echo " Imagen publicada"