    deploy:
        name: deploy
        runs-on: arc-runner-set #runner kubernetes local
        #needs: build
        defaults:
            run:
                working-directory: k8s       
        steps:
            - name: Descarga del codigo
              uses: actions/checkout@v7
            - name: listar
              run: ls
            - name: install kubectl
              uses: azure/setup-kubectl@v4
            - name: version kubectl
              run: kubectl version
            - name: desplegando imagen
              run: |
                IMAGEN="ghcr.io/roxsross/terraform-devops-labs:1.0.0"
                echo $IMAGEN
                echo "Desplegando la aplicacion en kubernetes"
                sed "s|IMAGEN_APP|${IMAGEN}|" deployment.yaml
                cat deployment.yaml