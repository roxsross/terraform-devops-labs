name: CI DEVOPS EDIT

on:
    push: 
        branches: [ga-develop]
    pull_request:
    workflow_dispatch:
env:
    REGISTRY: ghcr.io
    IMAGE_NAME: roxsross/terraform-devops-labs
jobs:
    test:
        name: test
        runs-on: ubuntu-26.04
        defaults:
            run:
                working-directory: app
        steps:
            - name: Descarga del codigo
              uses: actions/checkout@v7
            - name: Instalar Node.js
              uses: actions/setup-node@v7
              with:
                node-version: '24'
            - name: descarga de librerias de aplicacion
              run: npm install
            - name: Ejecutar los test
              run: npm test

    build:
        name: build
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            packages: write 
        needs: test
        defaults:
            run:
                working-directory: app    
        outputs:
          image: ${{ steps.version.outputs.image }}
          version: ${{ steps.version.outputs.version }}           
        steps:
            - name: Descarga del codigo
              uses: actions/checkout@v7
            - name: Obtener version de commit para la imagen
              id: version
              run: |
                VERSION="${GITHUB_SHA::7}"
                IMAGEN="${REGISTRY}/${IMAGE_NAME}:$VERSION"

                echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
                echo "image=${IMAGEN}" >> "$GITHUB_OUTPUT"

                echo "Version : ${VERSION}"
                echo "Imagen: ${IMAGEN}""

            - name: preparar instalacion docker
              uses: docker/setup-qemu-action@v4
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}            
            - name: Build and push
              uses: docker/build-push-action@v7
              with: 
                context: ./app
                platforms: linux/amd64,linux/arm64
                push: true
                tags: ${{ steps.version.outputs.image }}

    deploy:
        name: deploy
        runs-on: arc-runner-set #runner kubernetes local
        needs: build
        defaults:
            run:
                working-directory: k8s       
        steps:
            - name: Descarga del codigo
              uses: actions/checkout@v7
            - name: install kubectl
              uses: azure/setup-kubectl@v4
            - name: version kubectl
              run: kubectl version
            - name: desplegando imagen
              env: 
                IMAGEN: ${{ needs.build.outputs.image}}
              run: |
                echo $IMAGEN
                echo "Desplegando la aplicacion en kubernetes"
                sed "s|IMAGEN_APP|${IMAGEN}|" deployment.yaml | kubectl apply -f -
                kubectl apply -f service.yaml
            - name: Verificar despliegue
              run: kubectl rollout status deploy/tareas -n clase-cicd --timeout=180s