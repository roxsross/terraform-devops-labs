{{- if .Values.gateway.enabled }}
# Gateway y HTTPRoute (04-kubernetes/k8s/05-gateway.yaml y 06-httproute.yaml).
# La GatewayClass y Envoy Gateway son del lab 04 y no forman parte del chart.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web-gateway
  labels:
    {{- include "k8s-app.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.port }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  labels:
    {{- include "k8s-app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: web-gateway
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 80
{{- end }}
