# Valkey (04-kubernetes/k8s/02-valkey.yaml): base de datos del contador, en memoria.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels:
    {{- include "k8s-app.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: {{ .Values.valkey.image }}
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  labels:
    {{- include "k8s-app.labels" . | nindent 4 }}
spec:
  selector:
    app: valkey
  ports:
    - port: 6379
      targetPort: 6379
