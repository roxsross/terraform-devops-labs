# Values de ejemplo para el chart gha-runner-scale-set.
# NO pongas el token acá: este archivo se versiona.
#
# Uso (desde 05-github-actions-arc/):
#   helm install arc-runner-set \
#     --namespace arc-runners \
#     -f values.yaml \
#     --set githubConfigUrl="${GITHUB_CONFIG_URL}" \
#     oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
#
# Referencia completa:
# https://github.com/actions/actions-runner-controller/blob/master/charts/gha-runner-scale-set/values.yaml

# URL del repo dueño de los runners: https://github.com/<owner>/<repo>
# Se pasa con --set para no versionar datos de tu cuenta.
githubConfigUrl: ""

# Nombre de un Secret que ya existe en el namespace arc-runners
# y tiene la clave github_token (ver Paso 4 del README).
githubConfigSecret: pre-defined-secret

# Cantidad mínima y máxima de pods de runner.
# minRunners: 0 => no hay pods de runner hasta que llega un job.
minRunners: 0
maxRunners: 3

# Docker-in-Docker: permite `docker build` / `docker run` en los jobs.
# El chart agrega al pod de runner un sidecar `dind` (imagen docker:dind,
# privileged: true) que levanta dockerd, y le pone al contenedor `runner`
# DOCKER_HOST=unix:///var/run/docker.sock sobre un volumen compartido.
# Privileged = riesgo: aceptable en un cluster local propio, no en uno compartido.
containerMode:
  type: "dind"

# Pipeline CI/CD (sección "Pipeline completo" del README): los pods de runner
# usan la ServiceAccount arc-deployer de rbac-deployer.yaml para hacer
# helm upgrade --install en k8s-lab-dev y k8s-lab-prod, sin kubeconfig. Descomentalo SOLO después de
# aplicar rbac-deployer.yaml: si la ServiceAccount no existe, los pods de
# runner no se crean. El chart combina este template con el de dind.
# template:
#   spec:
#     serviceAccountName: arc-deployer

# Por defecto el scale set se llama igual que el release de Helm
# (arc-runner-set) y ese es el valor de runs-on en los workflows.
# runnerScaleSetName: "mi-scale-set"
